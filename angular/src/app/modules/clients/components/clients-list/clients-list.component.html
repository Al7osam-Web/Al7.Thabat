<div class="site-pages-shell clients-page">
  <header class="site-pages-shell__hero">
    <nav class="site-pages-shell__breadcrumb" aria-label="breadcrumb">
      <span>{{ '::Menu:Home' | abpLocalization }}</span>
      <i class="fa fa-angle-left" aria-hidden="true"></i>
      <span class="site-pages-shell__breadcrumb-current">{{ '::Clients:Title' | abpLocalization }}</span>
    </nav>
    <div class="site-pages-shell__hero-row">
      <div>
        <h1 class="site-pages-shell__title">{{ '::Clients:Title' | abpLocalization }}</h1>
        <p class="site-pages-shell__description">{{ '::Clients:Subtitle' | abpLocalization }}</p>
      </div>
    </div>
  </header>

  <div class="clients-page__toolbar">
    <button
      *abpPermission="'Thabat.Clients.Create'"
      type="button"
      class="site-page-form__save-btn"
      (click)="openCreate()"
    >
      <i class="fa fa-plus" aria-hidden="true"></i>
      {{ '::Clients:Create' | abpLocalization }}
    </button>
    <button type="button" class="clients-page__refresh" (click)="getRecords()" [disabled]="loader">
      <i class="fa fa-refresh" aria-hidden="true"></i>
      {{ '::Clients:Refresh' | abpLocalization }}
    </button>
  </div>

  <div class="site-pages-shell__card">
    <div *ngIf="isLoading" class="site-page-form__loading">
      <div class="spinner-border" role="status"></div>
    </div>

    <msn-grid
      *ngIf="!isLoading"
      [data]="dataList"
      [isDataInput]="false"
      [columns]="tableColumns"
      [actions]="tableActions"
      [pageSize]="fillter.pagination.pageSize"
      [totalRecordsLength]="fillter.pagination.totalCount"
      [pageIndex]="fillter.pagination.pageIndex"
      (pageIndexChange)="onPageIndexChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      [paginator]="(fillter.pagination.totalCount || 0) > (fillter.pagination.pageSize || 10)"
      [loading]="loader"
      [scrollable]="false"
      [moduleTitle]="'::Clients:Total' | abpLocalization"
      [isRowClickable]="false"
      (rowClicked)="openEdit($event)"
      (sortChanged)="onSortChanged($event)"
      (filterChanged)="onFilterChanged($event)"
      (dataChanged)="onDataChanged($event)"
    ></msn-grid>
  </div>
</div>

<p-confirmDialog [style]="{ width: 'min(440px, 92vw)' }"></p-confirmDialog>

<p-dialog
  [header]="(editingClientId ? '::Clients:Edit' : '::Clients:Create') | abpLocalization"
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(920px, 96vw)' }"
  [contentStyle]="{ overflow: 'visible', maxHeight: 'none' }"
  styleClass="clients-create-dialog"
>
  <app-client-form
    *ngIf="dialogVisible"
    [dialogMode]="true"
    [clientId]="editingClientId"
    (saved)="onClientSaved()"
    (cancelled)="dialogVisible = false"
  ></app-client-form>
</p-dialog>
