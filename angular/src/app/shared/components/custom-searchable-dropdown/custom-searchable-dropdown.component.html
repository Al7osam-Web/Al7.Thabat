  <p-dropdown (onChange)="onDropdownChange($event)" class="custom-search" [options]="options" [(ngModel)]="value" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true" [placeholder]=" placeholder | abpLocalization ">
    <ng-template pTemplate="selectedItem">
      <div class="flex align-items-center gap-2" *ngIf="value">
        <div>{{ selectedName }}</div>
      </div>
    </ng-template>
    <ng-template let-opt pTemplate="item">
      <div class="flex align-items-center gap-2">
        <div>{{ opt[optionLabel] }}</div>
      </div>
    </ng-template>
  </p-dropdown>
</div>
