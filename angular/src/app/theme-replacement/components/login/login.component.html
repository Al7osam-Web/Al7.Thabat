<div class="lpx-container">
  <div class="lpx-login-card text-center">
    <h2 class="mb-5">
      {{ 'AbpAccount::Login' | abpLocalization }}
    </h2>

    <!-- start register line -->
    @if (isSelfRegistrationEnabled) {
    <strong>
      {{ 'AbpAccount::AreYouANewUser' | abpLocalization }}
      <a
        class="text-decoration-none"
        routerLink="/account/register"
        queryParamsHandling="preserve"
        >{{ 'AbpAccount::Register' | abpLocalization }}</a
      >
    </strong>
    }
    <!-- end register line -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" validateOnSubmit class="mt-4 text-start">
      <div class="mb-3 form-group">
        <label for="login-input-user-name-or-email-address" class="form-label">
          {{ 'AbpAccount::UserNameOrEmailAddress' | abpLocalization }}
        </label>
        <input
          class="form-control"
          type="text"
          placeholder=" {{ 'AbpAccount::UserNameOrEmailAddress' | abpLocalization }}"
          id="login-input-user-name-or-email-address"
          formControlName="username"
          autocomplete="username"
          autofocus
        />
      </div>
      <div class="mb-3 form-group">
        <label for="login-input-password" class="form-label">{{
          'AbpAccount::Password' | abpLocalization
        }}</label>
        <input
          class="form-control"
          type="password"
          id="login-input-password"
          placeholder="{{ 'AbpAccount::Password' | abpLocalization }}"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <div class="p-0">
          <div class="form-check p-0">
            <label class="form-check-label mb-2" for="login-input-remember-me">
              <input
                class="form-check-input"
                type="checkbox"
                id="login-input-remember-me"
                formControlName="rememberMe"
              />
              {{ 'AbpAccount::RememberMe' | abpLocalization }}
            </label>
          </div>
        </div>
        <div class="text-end p-0">
          <a routerLink="/account/forgot-password">{{
            'AbpAccount::ForgotPassword' | abpLocalization
          }}</a>
        </div>
      </div>

      <abp-button
        [loading]="inProgress"
        buttonType="submit"
        class="btn-login"
        name="Action"
        buttonClass="btn-block  btn-lg mt-3 btn btn-primary w-100"
      >
        {{ 'AbpAccount::Login' | abpLocalization }}
      </abp-button>
    </form>
  </div>
</div>
