<div class="account-page new-login">
  <div class="account-split login-split">
    <aside class="login-split__brand">
      <div class="login-split__brand-inner">
        <div class="login-split__brand-header">
          <div class="login-logo-box">
            <img
              class="login-logo"
              src="assets/images/logo/thabat-logo.png"
              alt="{{ '::AppName' | abpLocalization }}"
            />
          </div>
        </div>

        <div class="login-split__brand-copy">
          <h1 class="login-split__brand-title" dir="auto">
            {{ '::Account:Brand:Title' | abpLocalization }}
          </h1>
          <p class="login-split__brand-description" dir="auto">
            {{ '::Account:Brand:Description' | abpLocalization }}
          </p>
        </div>
      </div>
    </aside>

    <section class="login-split__form">
      <div class="login-split__form-top">
        <abp-languages></abp-languages>
      </div>

      <div
        class="login-split__form-body"
        *ngIf="authWrapperService.enableLocalLogin$ | async; else disableLocalLoginTemplate"
      >
        <router-outlet></router-outlet>
      </div>

      <ng-template #disableLocalLoginTemplate>
        <div class="alert alert-warning">
          <strong>{{ 'AbpAccount::InvalidLoginRequest' | abpLocalization }}</strong>
          {{ 'AbpAccount::ThereAreNoLoginSchemesConfiguredForThisClient' | abpLocalization }}
        </div>
      </ng-template>
    </section>
  </div>
</div>
